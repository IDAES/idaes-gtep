[logging]
level = "INFO"

[data]
data_path = "../gtep/data/123_Bus_Coal"
stages = 3
num_reps = 5
len_reps = 24
num_commit = 24
num_dispatch = 1
duration_dispatch = 60

# Extra data-processing steps used by this case
load_scaling_path = "./gtep/data/123_Bus_Coal/ERCOT-Adjusted-Forecast.xlsb"
apply_texas_case_study_updates = true

[cost_data]
enabled = false

[model]
include_investment = true
include_commitment = true
include_redispatch = true
scale_loads = false
scale_texas_loads = true
transmission = false
storage = false
flow_model = "CP"
advanced_hydro = false

[transformations]
bound_pretransformation = false
bigm = true

[solver]
name = "gurobi_direct"
tee = true
log_file = "basic_logging.log"

[results]
dir_name = "results"
value_threshold = 1e-3

